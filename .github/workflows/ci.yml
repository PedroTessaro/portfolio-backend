name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -coverprofile=cover.out ./...

      # The terminal claims a test count and a coverage figure. This is where
      # those numbers come from — nobody types them anywhere.
      #
      # This posts to the service rather than writing to its Redis directly, so
      # the workflow holds a token for one endpoint instead of credentials for
      # the whole database.
      - name: publish results
        if: github.ref == 'refs/heads/main'
        env:
          PUBLISH_TOKEN: ${{ secrets.CI_PUBLISH_TOKEN }}
        run: |
          tests=$(go test ./... -list '.*' 2>/dev/null | grep -c '^Test' || true)
          coverage=$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')

          payload=$(jq -nc \
            --arg status "passing" \
            --arg sha "${GITHUB_SHA:0:7}" \
            --argjson tests "${tests:-0}" \
            --argjson coverage "${coverage:-0}" \
            '{status:$status, sha:$sha, tests:$tests, coverage:$coverage}')

          echo "publishing: $payload"
          curl -fsS --globoff -X POST "https://pedrotessaro.vercel.app/internal/ci" \
            -H "Authorization: Bearer ${PUBLISH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload"
